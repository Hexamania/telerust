[workspace]
resolver = "2"
members = [
    "telerust-core",
    "telerust-cli",
]
exclude = []

[workspace.dependencies]
grammers-client = { version = "0.12", features = ["fs"] }
grammers-session = "0.12"
grammers-mtsender = "0.12"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
config = "0.14"
directories = "5.0"