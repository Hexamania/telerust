[package]
name = "telerust-gui-wry"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
telerust-core = { path = "../telerust-core" }
wry = "0.38"
tao = { version = "0.28", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
directories = "5.0"